name: CSS Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка CSS
        run: npx stylelint "**/*.css"